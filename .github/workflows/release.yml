name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  # Read the Verify workflow's runs (the gate below); nothing is written.
  actions: read

jobs:
  release:
    name: Publish to npm (trusted publishing)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.3.0'
          # No npm cache in a job that publishes: a poisoned cache must not reach the tarball.

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Check this runs on a tag that matches package.json
        # Applies to both triggers: a manual run must also be started from a
        # v* tag, so only a deliberately tagged version can be published.
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release must run on a v* tag, not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Require a green Verify run for this exact commit
        # The Verify workflow runs the checks on Node 26.3.0 and the consumer
        # matrix on Node 20 to 24. This job re-runs the checks on one version,
        # so the tag must also sit on a commit where the whole workflow passed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PASSED="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')"
          if [ "$PASSED" -lt 1 ]; then
            echo "::error::No successful Verify run for commit ${GITHUB_SHA}. Merge through a green Verify run, then tag that commit."
            exit 1
          fi

      - name: Audit locked dependencies
        run: npm run audit:dependencies

      - name: Verify
        run: npm run verify

      - name: Check types (attw)
        run: npm run attw

      - name: Check whether this version is already published
        id: check
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          # Only a confirmed E404 means "not published yet". Any other registry
          # error (outage, auth, network) fails the job instead of guessing.
          set +e
          OUTPUT="$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ] && [ -n "$OUTPUT" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} is already on the registry; nothing to do."
          elif echo "$OUTPUT" | grep -q "E404"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine registry state for ${PKG_NAME}@${PKG_VERSION}: ${OUTPUT}"
            exit 1
          fi

      - name: Publish to npm
        if: steps.check.outputs.already_published == 'false'
        # The checks above are the checks: skip the lifecycle scripts so the
        # test suite does not run a second time (prepublishOnly runs verify).
        # dist/ is the one the Verify step above built and tested.
        run: npm publish --ignore-scripts
